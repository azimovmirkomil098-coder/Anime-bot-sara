services:
  - type: web
    name: anime-bot-sara
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: anime_bot.db
      - key: WEBHOOK_SECRET
        generateValue: true
