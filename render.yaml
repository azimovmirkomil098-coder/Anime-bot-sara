services:
  - type: worker
    name: anime-bot-sara
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/anime_bot.db
    disk:
      name: anime-bot-data
      mountPath: /var/data
      sizeGB: 1
